baseURL = 'https://display-tubes.org/'
languageCode = 'en-us'
title = 'Display Tubes'
theme = 'slick'

[pagination]
  pagerSize = 1000

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        codeFences = true
        guessSyntax = true
        noClasses = false

[params]
    description = "This website is dedicated to my fascination with all kinds of vintage display devices: Nixie tubes, VFDs, Numitrons, and more. My goal is to showcases their ingenious design through carefully curated images as well as additional information on their operation."
    showNavHeader = true
    
    dateFmt = "02 Jan 2006"
    showMetaDates = true
    showRssLink = true
    showmetalinks = true

    opengraph = true

    mainSections = ["nixie", "other", "nomotron", "documents", "numitron", "magic-eye", "vfd", "dekatron"]


[sitemap]
    changefreq = "daily"
    filename = "sitemap.xml"
    priority =  -1
